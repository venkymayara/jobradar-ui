<section class="section"><h2>Popular skills</h2><p>Search opportunities by the skills employers are looking for.</p>
  @if (loading) { <p role="status">Loading popular skills…</p> }
  @else if (error) { <p role="alert">{{ error }}</p> }
  @else if (skills.length) { <div class="chips">@for (skill of skills; track skill.skillId) {<button type="button" (click)="search(skill.skillName)">{{ skill.skillName }}</button>}</div> }
  @else { <p>No popular skills to show yet.</p> }
</section>
