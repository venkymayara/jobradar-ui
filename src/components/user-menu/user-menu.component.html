<div class="actions">
  @if (auth.isAuthenticated()) {
    <span class="user-name">{{ user()?.displayName || auth.currentUser()?.displayName || 'Your account' }}</span>
    <a class="publish" routerLink="/dashboard">Dashboard</a>
    <button type="button" class="login" (click)="logout()">Sign out</button>
  } @else {
    <a class="login" routerLink="/login">Log in</a>
    <a class="publish" routerLink="/publish">Post an opportunity</a>
  }
</div>
@if (error()) { <span class="auth-error" role="alert">{{ error() }}</span> }\n@if (auth.sessionError()) { <span class="auth-error" role="alert">{{ auth.sessionError() }}</span> }
